# Core
spark.sql.adaptive.enabled                         true
spark.sql.adaptive.coalescePartitions.enabled      true
spark.default.parallelism                           8
spark.sql.shuffle.partitions                        16

# Files/Partitions
spark.sql.files.maxPartitionBytes                   32m
spark.sql.files.openCostInBytes                     4m

# Memory (jupyter overrides still apply)
spark.executor.memory                               1g
spark.executor.cores                                1
spark.driver.memory                                 1g
spark.local.dir                                     /tmp

# Joins
spark.sql.autoBroadcastJoinThreshold                16m

# Misc
spark.ui.prometheus.enabled                         false

# Always attach extra jars (JDBC + S3A)
spark.jars /jars/postgresql-42.7.4.jar,/jars/hadoop-aws-3.3.4.jar,/jars/aws-java-sdk-bundle-1.12.262.jar
spark.driver.extraClassPath /jars/*
spark.executor.extraClassPath /jars/*

# MinIO / S3A endpoint (secrets keep in env, as you already do in code)
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
